services:
  mysql:
    image: mysql:8.0
    container_name: aicho-muse-letter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-letterroot123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicho_muse_letter}
      MYSQL_USER: ${MYSQL_USER:-letter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-letter123}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-log-bin
    volumes:
      - letter_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-letterroot123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicho-muse-letter-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3004
      GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-3}
      GENERATION_QUEUE_SIZE: ${GENERATION_QUEUE_SIZE:-50}
      REQUESTS_PER_HOUR: ${REQUESTS_PER_HOUR:-30}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aicho_muse_letter}
      MYSQL_USER: ${MYSQL_USER:-letter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-letter123}
      MUSE_BASE_URL: ${MUSE_BASE_URL:-http://aicho-muse-app:3001/api/v1/letter}
      # 管理接口鉴权：muse 后台代理调用信件管理/反馈统计接口时使用（与 muse 的 LETTER_FEEDBACK_TOKEN 同值）
      FEEDBACK_ADMIN_TOKEN: ${FEEDBACK_ADMIN_TOKEN:-}
    ports:
      - "${APP_PORT:-3004}:3004"
    volumes:
      - letter_app_data:/app/data
    # 接入 muse 的网络：两者是独立 compose 项目，默认不在同一网络，
    # 容器名 aicho-muse-app 无法解析（ENOTFOUND）；加入后可直接用容器名互访。
    networks:
      - default
      - muse-net

volumes:
  letter_mysql_data:
  letter_app_data:

networks:
  muse-net:
    external: true
    name: aicho-muse_default
